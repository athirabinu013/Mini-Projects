<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width , initial-scale = 1.0">
        <title>
            CALCULATOR
        </title>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>

    <div class = "container">
        <p class = "title">RookieCalc</p>
        <div class="screen">
            <div class="expression"></div>
            <div class="answer"></div>
        </div>

        <div class="row0">
            <button id="ac" class="sign">AC</button>
            <button id="percent" class="sign">%</button>
            <button id="backspace" class="sign">⌫</button>
            <button id="divide" class="sign">÷</button>
        </div>

        <div class="row1">
            <button class="seven">7</button>
            <button class="eight">8</button>
            <button class="nine">9</button>
            <button id="multiply" class="sign">×</button>
        </div>

        <div class="row2">
            <button class="four">4</button>
            <button class="five">5</button>
            <button class="six">6</button>
            <button id="subtract" class="sign">−</button>
        </div>

        <div class="row3">
            <button class="one">1</button>
            <button class="two">2</button>
            <button class="three">3</button>
            <button id="add" class="sign">+</button>
        </div>

        <div class="row4">
            <button class="double-zero">00</button>
            <button class="zero">0</button>
            <button class="decimal">.</button>
            <button id="equals" class="equal">=</button>
        </div>

     </div>
        <script src="script.js"></script>
    </body>
</html>
